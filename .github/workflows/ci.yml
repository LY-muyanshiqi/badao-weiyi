name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'outputs/**'
      - 'data/**'
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=15 --statistics

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m compileall src/ -q

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn scipy matplotlib joblib tqdm openpyxl

      - name: Verify imports
        run: |
          python -c "
          import pandas, numpy, sklearn, scipy, matplotlib, joblib, tqdm, openpyxl
          print(f'pandas {pandas.__version__}')
          print(f'numpy {numpy.__version__}')
          print(f'sklearn {sklearn.__version__}')
          print('All core imports OK')
          "

  test:
    runs-on: ubuntu-latest
    needs: [deps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn scipy matplotlib joblib tqdm openpyxl torch

      - name: Test model instantiation
        run: |
          cd src/core
          python transformer_model.py

      - name: Test data pipeline
        run: |
          cd src/core
          python data_pipeline.py

      - name: Test diagnostic engine
        run: |
          cd src/core
          python diagnostic_engine.py
